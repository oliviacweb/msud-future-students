name: Accessibility

on:
  pull_request:

permissions:
  contents: read

jobs:
  a11y:
    # Branch protection requires this check by name, so keep it as is.
    name: Accessibility check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The site is built from this pull request with sample WordPress content
      # served inside this job, so the check never depends on an outside site.
      WORDPRESS_API_URL: http://127.0.0.1:8787/wp-json/wp/v2
      WEBHOOK_SECRET: accessibility-check-only
      BASE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out this pull request
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            a11y/package-lock.json

      - name: Install the site
        run: npm ci

      - name: Install the checker
        working-directory: a11y
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Serve sample WordPress content
        run: |
          nohup node a11y/sample-wordpress.mjs > sample-wordpress.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf "$WORDPRESS_API_URL/posts" > /dev/null && exit 0
            sleep 1
          done
          cat sample-wordpress.log
          exit 1

      - name: Build this pull request
        run: npm run build

      - name: Start the site
        run: |
          nohup npm start > site.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf "$BASE_URL/" > /dev/null && exit 0
            sleep 1
          done
          cat site.log
          exit 1

      - name: Check pages against WCAG 2.1 A and AA
        working-directory: a11y
        run: npx playwright test
