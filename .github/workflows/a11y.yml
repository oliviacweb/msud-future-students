name: Accessibility

on:
  pull_request:

jobs:
  a11y:
    name: Accessibility check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Your Next.js site's name on Pantheon.
      PANTHEON_SITE: msud-future-students-ow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: a11y/package-lock.json

      - name: Install the checker
        working-directory: a11y
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for this pull request's Pantheon environment
        id: preview
        run: |
          BASE_URL="https://pr-${{ github.event.pull_request.number }}-${PANTHEON_SITE}.pantheonsite.io"
          COMMIT_TIME=$(git log -1 --format=%ct)
          echo "Waiting for Pantheon to serve a build of this commit at $BASE_URL"
          for attempt in $(seq 1 60); do
            BUILD_TIME=$(curl -s "$BASE_URL/" | grep -o 'name="x-build-time" content="[0-9]*"' | grep -o '[0-9][0-9]*' || true)
            if [ -n "$BUILD_TIME" ] && [ "$BUILD_TIME" -ge "$COMMIT_TIME" ]; then
              echo "Ready: Pantheon built this commit at $(date -u -d "@$BUILD_TIME")"
              echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Not ready yet (attempt $attempt of 60)"
            sleep 20
          done
          echo "Pantheon never served a build of this commit. Check the build log in the Pantheon dashboard."
          exit 1

      - name: Run axe against the Pantheon environment
        working-directory: a11y
        env:
          BASE_URL: ${{ steps.preview.outputs.base_url }}
        run: npx playwright test
